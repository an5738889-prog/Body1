name: Build Body Injury Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v3
      - name: Setup wrapper
        run: |
          gradle wrapper --gradle-version 8.8 || true
          chmod +x gradlew || true
      - name: Build
        run: |
          if [ -f ./gradlew ]; then ./gradlew build --no-daemon; else gradle build --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bodyinjury-jar
          path: build/libs/*.jar
          retention-days: 30
